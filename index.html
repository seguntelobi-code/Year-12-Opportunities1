<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year 12 Opportunities Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:Arial,Helvetica,sans-serif}
header{background:#174a7e;color:#fff;padding:34px 18px 30px}.wrap{max-width:1080px;margin:auto}
h1{margin:0;font-size:34px}header p{margin:8px 0 0;color:#dbeafe}main{padding:20px 16px 60px}
.toolbar{background:#fff;border:1px solid #d8e0e9;border-radius:12px;padding:14px;display:flex;gap:10px;flex-wrap:wrap}
input,select{border:1px solid #cbd5e1;border-radius:8px;padding:11px 12px;background:#fff;font:inherit;flex:1;min-width:180px}
button{border:1px solid #174a7e;background:#fff;color:#174a7e;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.status{font-size:12px;color:#667085;margin:10px 0}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;margin-bottom:11px}
h2{margin:0;font-size:23px}.count{color:#667085;font-size:13px}.subnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.pill{border:1px solid #cbd5e1;background:#fff;color:#344054;border-radius:999px;padding:7px 11px;font-size:13px}
.pill.active{background:#174a7e;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(275px,1fr));gap:13px}
.card{background:#fff;border:1px solid #d8e0e9;border-radius:12px;padding:16px}.card h3{margin:0 0 7px;font-size:17px}
.org{font-size:13px;font-weight:700;color:#475467}.desc{font-size:14px;line-height:1.5;color:#667085;margin:9px 0}
.tag{display:inline-block;font-size:12px;background:#edf4fb;color:#174a7e;padding:5px 8px;border-radius:999px;margin:3px 3px 3px 0}
.deadline{font-size:13px;font-weight:700;margin:8px 0;color:#344054}.soon{color:#b54708}.btn{display:inline-block;background:#174a7e;color:#fff;text-decoration:none;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:700}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:10px;padding:20px;color:#667085}footer{text-align:center;color:#98a2b3;font-size:12px;margin-top:35px}
</style></head><body>
<header><div class="wrap"><h1>Year 12 Opportunities Hub</h1><p>Work experience, insight days, careers, university pathways and workshops — all in one place.</p></div></header>
<main class="wrap"><div class="toolbar">
<input id="search" placeholder="Search opportunities…">
<select id="type"><option value="">All sections</option><option>Work Experience</option><option>Insight Days</option><option>Career Pathways</option><option>University Pathways</option><option>Workshops & Events</option></select>
<select id="timing"><option value="">Any deadline</option><option value="soon">Deadlines in next 60 days</option><option value="open">No deadline listed</option></select>
<button id="clear">Clear</button></div><div class="status" id="status"></div><div id="app"></div>
<footer>Sixth Form Committee • Year 12</footer></main>
<script>
const GOOGLE_SHEET_CSV_URL="";
const SAMPLE=[
["Work Experience","Finance & Business","Example finance placement","Example organisation","","Finance, accounting, banking and business experience.","https://example.com"],
["Work Experience","Law, Government & Public Service","Example legal opportunity","Example organisation","","Solicitor, barrister, government, policy and public service experience.","https://example.com"],
["Work Experience","Medicine & Health","Example healthcare opportunity","Example organisation","","Medicine, nursing, dentistry, pharmacy, veterinary and wider healthcare.","https://example.com"],
["Work Experience","Science, Technology & Engineering","Example STEM opportunity","Example organisation","","Science, technology, engineering, computing, data and laboratory careers.","https://example.com"],
["Work Experience","Construction, Property & Skilled Trades","Example construction opportunity","Example organisation","","Construction, architecture, surveying, property and skilled trades.","https://example.com"],
["Work Experience","Education, Childcare & Social Care","Example education opportunity","Example organisation","","Teaching, childcare, youth work and social care.","https://example.com"],
["Work Experience","Retail, Hospitality & Customer Service","Example hospitality opportunity","Example organisation","","Retail, cafés, restaurants, hotels, tourism and customer-facing careers.","https://example.com"],
["Work Experience","Creative, Media & Communications","Example creative opportunity","Example organisation","","Design, journalism, film, marketing, communications and content.","https://example.com"],
["Work Experience","Sport, Fitness & Leisure","Example sport opportunity","Example organisation","","Sport, coaching, fitness, events and leisure careers.","https://example.com"],
["Work Experience","Environment, Animals & Agriculture","Example environment opportunity","Example organisation","","Environment, conservation, agriculture, animal care and outdoor careers.","https://example.com"],
["Work Experience","Public Safety & Emergency Services","Example police/fire/ambulance opportunity","Example organisation","","Police, fire, ambulance, emergency services and public safety careers.","https://example.com"],
["Insight Days","All career areas","Example insight day","Example organisation","","Employer or university insight day.","https://example.com"],
["Career Pathways","Explore careers","Example career pathway","Provider","","Career guides, industry information and pathway resources.","https://example.com"],
["University Pathways","Universities & Summer Schools","Example university opportunity","University/provider","","Open days, summer schools and widening-participation programmes.","https://example.com"],
["Workshops & Events","Applications & Employability","Example CV workshop","Provider","","CVs, applications, interviews and employability sessions.","https://example.com"]];

function parseCSV(s){let rows=[],row=[],c="",q=false;for(let i=0;i<s.length;i++){let x=s[i],n=s[i+1];if(x=='"'&&q&&n=='"'){c+='"';i++}else if(x=='"')q=!q;else if(x==','&&!q){row.push(c);c=""}else if((x=='\n'||x=='\r')&&!q){if(x=='\r'&&n=='\n')i++;row.push(c);if(row.some(v=>v.trim()))rows.push(row);row=[];c=""}else c+=x}if(c||row.length){row.push(c);if(row.some(v=>v.trim()))rows.push(row)}return rows}
function rowsToData(r){let start=(r[0]&&r[0][0].toLowerCase().includes("section"))?1:0;return r.slice(start).filter(x=>x.length>=7&&x[2]).map(x=>({section:x[0].trim(),area:x[1].trim(),title:x[2].trim(),org:x[3].trim(),deadline:x[4].trim(),desc:x[5].trim(),link:x[6].trim()}))}
let DATA=[],area="";
const app=document.getElementById("app"),search=document.getElementById("search"),type=document.getElementById("type"),timing=document.getElementById("timing"),status=document.getElementById("status");
function days(d){if(!d)return null;let x=new Date(d+"T23:59:59");return isNaN(x)?null:Math.ceil((x-new Date())/86400000)}
function render(){let q=search.value.toLowerCase().trim(),t=type.value,f=timing.value;
let rows=DATA.filter(x=>(!t||x.section===t)&&(!area||x.area===area)&&(!q||[x.title,x.org,x.desc,x.area,x.section].join(" ").toLowerCase().includes(q)));
if(f==="soon")rows=rows.filter(x=>{let d=days(x.deadline);return d!==null&&d>=0&&d<=60});if(f==="open")rows=rows.filter(x=>!x.deadline);
app.innerHTML="";let secs=[...new Set(rows.map(x=>x.section))];
secs.forEach(sec=>{let items=rows.filter(x=>x.section===sec),w=document.createElement("section");w.className="section";w.innerHTML='<div class="section-head"><h2>'+sec+'</h2><span class="count">'+items.length+' opportunities</span></div>';
let nav=document.createElement("div");nav.className="subnav";let all=document.createElement("button");all.className="pill"+(!area?" active":"");all.textContent="All areas";all.onclick=()=>{area="";render()};nav.appendChild(all);
[...new Set(DATA.filter(x=>x.section===sec).map(x=>x.area))].forEach(a=>{let b=document.createElement("button");b.className="pill"+(area===a?" active":"");b.textContent=a;b.onclick=()=>{area=a;render()};nav.appendChild(b)});w.appendChild(nav);
let grid=document.createElement("div");grid.className="grid";items.forEach(x=>{let c=document.createElement("article");c.className="card";let d=days(x.deadline),dl=x.deadline?"Deadline: "+(isNaN(new Date(x.deadline))?x.deadline:new Date(x.deadline+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})):"No deadline listed";
c.innerHTML='<h3>'+x.title+'</h3><div class="org">'+x.org+'</div><p class="desc">'+x.desc+'</p><span class="tag">'+x.area+'</span><div class="deadline '+(d!==null&&d>=0&&d<=14?"soon":"")+'">'+dl+(d!==null&&d>=0&&d<=14?" • Coming up":"")+'</div><a class="btn" href="'+x.link+'" target="_blank" rel="noopener">View opportunity</a>';grid.appendChild(c)});w.appendChild(grid);app.appendChild(w)});
if(!secs.length)app.innerHTML='<div class="empty">No opportunities match your search or filters.</div>'}
async function load(){if(!GOOGLE_SHEET_CSV_URL){DATA=rowsToData(SAMPLE);status.textContent="Starter data loaded. Connect your Google Sheet when ready.";return render()}try{let r=await fetch(GOOGLE_SHEET_CSV_URL);DATA=rowsToData(parseCSV(await r.text()));status.textContent="Live opportunities loaded from Google Sheets.";render()}catch(e){DATA=rowsToData(SAMPLE);status.textContent="Google Sheet could not be loaded; showing starter data.";render()}}
[search,type,timing].forEach(e=>e.addEventListener("input",()=>{area="";render()}));document.getElementById("clear").onclick=()=>{search.value="";type.value="";timing.value="";area="";render()};load();
</script></body></html>
